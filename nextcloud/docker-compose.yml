version: '3'

services:
  nextcloud:
    image: nextcloud:${NC_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    user: ${USER_UID:-1000}:${USER_GID:-1000}
    volumes:
      - ${NC_APP_ROOT:-/opt/persistent-storage/nextcloud/app}:/var/www/html
    networks:
      - nextcloud
    ports:
      - ${NC_HTTP_PORT:-8080}:80
    depends_on:
      - redis
      - postgres
  redis:
    image: redis
    restart: unless-stopped
    networks:
      - nextcloud
  postgres:
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_VERSION:-14}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${POSTGRES_APP_ROOT:-/opt/persistent-storage/nextcloud/postgres}:/var/lib/postgresql/data
    networks:
      - nextcloud


networks:
  nextcloud:
