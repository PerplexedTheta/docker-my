version: '3'

services:
  homer:
    image: b4bz/homer:${HOMER_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${HOMER_APP_ROOT:-/opt/persistent-storage/homer/app}:/www/assets
    user: ${USER_UID:-1000}:${USER_GID:-1000}
    networks:
      - homer
    ports:
      - ${HOMER_APP_PORT:-8080}:8080

networks:
  homer:
    enable_ipv6: true
