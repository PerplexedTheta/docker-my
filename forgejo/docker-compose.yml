version: '3'

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    user: ${USER_UID:-1000}:${USER_GID:-1000}
    volumes:
      - ${FORGEJO_APP_ROOT:-/opt/persistent-storage/forgejo/app}:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - forgejo
    ports:
      - '3000:3000'
      - '222:22'
  postgres:
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_VERSION:-14}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${POSTGRES_APP_ROOT:-/opt/persistent-storage/forgejo/postgres}:/var/lib/postgresql/data
    networks:
      - forgejo

networks:
  forgejo:
