version: '3'

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION:-15}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${FORGEJO_APP_ROOT:-/opt/persistent-storage/forgejo/app}:/data
      - ${FORGEJO_GIT_ROOT:-/opt/persistent-storage/forgejo/app/git}:/data/git
      - ${FORGEJO_PKG_ROOT:-/opt/persistent-storage/forgejo/app/gitea/packages}:/data/gitea/packages
      - /etc/localtime:/etc/localtime:ro
    networks:
      - forgejo
    ports:
      - ${FORGEJO_HTTP_PORT:-3000}:3000
      - ${FORGEJO_SSH_PORT:-9418}:22
    depends_on:
      - postgres
  postgres:
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_VERSION:-18}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${POSTGRES_APP_ROOT:-/opt/persistent-storage/forgejo/postgres}:/var/lib/postgresql
    networks:
      - forgejo

networks:
  forgejo:
    enable_ipv6: true
