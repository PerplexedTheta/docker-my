version: '3'

services:
  drawio:
    image: wettyoss/wetty:${WETTY_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    command: --host='::' --ssh-host='host.docker.internal' --base='/' --ssh-port=22
    user: ${USER_UID:-1000}:${USER_GID:-1000}
    networks:
      - wetty
    ports:
      - ${WETTY_HTTP_PORT:-3000}:3000
    extra_hosts:
      - host.docker.internal:host-gateway
    tty: true

networks:
  wetty:
    enable_ipv6: true
